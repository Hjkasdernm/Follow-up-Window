<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Follow-up Window</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f5efe0;--card:#fffdf6;--ink:#2b2a24;--mut:#7a7566;--g:#1f4d3a;--hd:#1f4d3a;--gold:#c9a227;--line:#e2d9bf;--red:#c0392b;--grn:#1e8449;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Segoe UI,sans-serif}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--g);color:#fff;border:0}button.alt{background:transparent;color:var(--hd);border:1px solid var(--hd)}button:disabled{opacity:.4;cursor:default}button.gold{background:var(--gold);color:#222}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.login{width:100%;max-width:380px;display:grid;gap:10px}.login h1{color:var(--hd);text-align:center;font-size:24px}.login h3,.login h2{text-align:center;color:var(--mut);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--red);min-height:18px}
#app{display:flex;min-height:100vh}
aside{width:200px;background:var(--g);color:#e9e4cf;padding:16px 0;flex:none}
aside h3{padding:0 16px 14px;color:var(--gold);font-size:16px}
aside a{display:block;padding:10px 16px;cursor:pointer}aside a.on{background:var(--gold);color:#222;font-weight:600}
main{flex:1;min-width:0;padding:16px}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}.hd h1{color:var(--hd);font-size:22px}.hd small{color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right}
th{background:var(--ink);color:var(--bg);position:sticky;top:0;font-weight:600}td:nth-child(-n+4),th:nth-child(-n+4){text-align:left}.tw td.fq,.tw th.fq{text-align:center}
tr.c{cursor:pointer}tr.c:hover{background:rgba(201,162,39,.15)}
.up{color:var(--red)}.dn{color:var(--grn)}.mut{color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:20}
#mbox{background:var(--card);border-radius:10px;width:100%;max-width:760px;padding:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--g);color:#fff;padding:9px 16px;border-radius:20px;z-index:40}
#load{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;color:#fff;font-size:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;margin:8px 0}.kv b{color:var(--hd)}
.ex li{margin:4px 0}tbody tr:nth-child(even){background:rgba(128,128,128,.09)}.tw{box-shadow:0 2px 8px rgba(0,0,0,.18)}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px}.kp small{display:block;color:var(--mut)}.kp b{font:700 20px Georgia,serif}.ban{background:linear-gradient(135deg,#1f4d3a,#2f6b50);color:#fff;border-radius:10px;border-bottom:4px solid var(--gold);padding:12px 14px;margin-bottom:10px}.ban h2{color:#fff}.ban small{color:#e0c15a}#cap{background:var(--card);padding:10px;border-radius:8px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button.on{background:var(--gold);color:#222}button.wa{background:#25D366;color:#053}
@media(max-width:700px){aside{width:100%;position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;padding:0}aside h3{display:none}aside a{flex:1;text-align:center}#app{flex-direction:column}main{padding-bottom:64px}}
</style></head><body>
<div id="login" class="center"><div class="card login" id="lbox"></div></div>
<div id="app" hidden>
<aside><h3>Follow-up Window</h3><a id="n1" onclick="go('s')">Follow-up</a><a id="n3" onclick="go('r')">Reports</a><a id="n2" onclick="go('f')">Files</a><a onclick="logout()">Logout</a></aside>
<main>
<div class="hd"><div><h1>Dawat e Islami</h1><small>Donation Box Department &middot; Follow-up Window</small></div><div class="mut" id="who"></div></div>
<div id="pg"></div></main></div>
<div id="modal" hidden onclick="if(event.target===this)this.hidden=true"><div id="mbox"></div></div>
<div id="toast" hidden></div>
<div id="load" hidden>Please wait…</div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const S={user:null,token:null,box:null,prev:null,cur:null,page:'s',f:{div:'',dis:'',a:'',b:'',q:''},pg:0,unsaved:false,rp:0,loaded:false};
const DIVS=['Banbhore','Hyderabad','Jacobabad','Larkana','Mir Pur Khas','Nawabshah','Sukkur'];
const DES=['Division Zimedar','Office Zimedar','Supervisor','District Zimedar'];

/* ---------- Server bridge (Google Apps Script Web App API) ---------- */
const API_URL='https://script.google.com/macros/s/AKfycbztM9safSreob2ug3vRryqoHrFnFUbk6NMncvrQKo3ZZzsmb_4TE6Msndx1yXfTM89ZRw/exec';
async function call(fn,...args){
  let r,t;
  try{
    r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});
    t=await r.text();
  }catch(e){throw Error('Internet / server connection failed. Check internet and try again.')}
  let j;
  try{j=JSON.parse(t)}catch(e){throw Error('Server link is wrong or Web App is not deployed with access "Anyone".')}
  if(!j.ok){
    const m=String(j.error||'Server error');
    if(m.indexOf('SESSION')>-1){S.user=null;S.token=null;S.loaded=false;showLoad(false);showLogin();toast('Session expired, please login again');throw Error('Session expired')}
    throw Error(m)
  }
  return j.data;
}
async function dbGet(k){const r=await call('getData',S.token,k);return r?JSON.parse(r):null}
async function dbSet(k,v){return call('saveData',S.token,k,(v===undefined||v===null)?null:JSON.stringify(v))}
function showLoad(on){$('#load').hidden=!on}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const fmt=n=>n==null?'\u2014':Number(n).toLocaleString('en-US');
function ymd(v){if(typeof v==='number')return(d=>[d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()])(new Date(Math.floor(v-25569)*864e5));const m=String(v).match(/(\d{4})-(\d\d)-(\d\d)/);return m?[+m[1],+m[2],+m[3]]:null}
const dlabel=(d,ym)=>d==null?'\u2014':pad(d)+'-'+pad(ym[1])+'-'+ym[0];

/* ---------- Login ---------- */
function showLogin(){$('#login').hidden=false;$('#app').hidden=true;$('#lbox').innerHTML=`<h1>Dawat e Islami</h1><h2>Donation Box Department</h2><h3>Follow-up Window</h3>
<input id="lid" placeholder="Login ID (Emp Code)"><input id="lpw" type="password" placeholder="Password (default 123)">
<div class="err" id="lerr"></div><div class="row"><button onclick="doLogin()">Login</button><button class="alt" onclick="showCreate()">Create ID</button></div>`;$('#lpw').onkeydown=e=>{if(e.key==='Enter')doLogin()}}

function doLogin(){
  const id=$('#lid').value.trim(),pw=$('#lpw').value;
  $('#lerr').textContent='Checking…';showLoad(true);
  call('login',id,pw).then(r=>{
    showLoad(false);
    if(!r||!r.ok){$('#lerr').textContent=(r&&r.error)||'Invalid ID or password';return}
    S.user=r.user;S.token=r.token;S.loaded=false;start();
  }).catch(e=>{showLoad(false);$('#lerr').textContent='Error: '+e.message});
}

function showCreate(){$('#lbox').innerHTML=`<h2>Create ID</h2><small class="mut">Only admin can create IDs</small>
<input id="aid" placeholder="Admin ID"><input id="apw" type="password" placeholder="Admin Password">
<input id="cdiv" list="dl" placeholder="Division"><datalist id="dl">${DIVS.map(d=>`<option>${d}</option>`).join('')}</datalist>
<input id="ccode" placeholder="Emp Code"><input id="cpw" value="123" placeholder="Password">
<select id="cdes">${DES.map(d=>`<option>${d}</option>`).join('')}</select><div class="err" id="lerr"></div>
<div class="row"><button onclick="doCreate()">Create ID</button><button class="alt" onclick="showLogin()">Back to Login</button></div>`}

function doCreate(){
  const aid=$('#aid').value.trim(),apw=$('#apw').value,code=$('#ccode').value.trim(),pw=$('#cpw').value,div=$('#cdiv').value.trim(),des=$('#cdes').value;
  $('#lerr').textContent='Creating…';showLoad(true);
  call('createUser',aid,apw,code,pw,div,des).then(r=>{
    showLoad(false);
    if(!r||!r.ok){$('#lerr').textContent=(r&&r.error)||'Failed';return}
    toast('ID created: '+code);showLogin();
  }).catch(e=>{showLoad(false);$('#lerr').textContent='Error: '+e.message});
}

function logout(){S.user=null;S.token=null;S.loaded=false;S.box=S.prev=S.cur=null;S.unsaved=false;S.page='s';showLogin()}

/* ---------- Boot / data ---------- */
async function start(){
  $('#login').hidden=true;$('#app').hidden=false;
  $('#who').textContent=(S.user.admin?'Admin':(S.user.des||'')+' \u00b7 '+S.user.div)+' \u00b7 ID '+S.user.code;
  if(!S.loaded){
    showLoad(true);
    try{
      const [b,p,c]=await Promise.all([dbGet('box'),dbGet('prev'),dbGet('cur')]);
      S.box=b;S.prev=p;S.cur=c;S.loaded=true;
      const n=new Date();
      if(S.cur&&(n.getFullYear()*12+n.getMonth()+1)>(S.cur.ym[0]*12+S.cur.ym[1])){
        S.box=S.prev=S.cur=null;
        await Promise.all([dbSet('box',null),dbSet('prev',null),dbSet('cur',null)]);
        toast('Month ended: saved data was cleared, upload new files');
      }
    }catch(e){toast('Load error: '+e.message)}
    finally{showLoad(false)}
  }
  go('s');
}

function go(p){S.page=p;S.pg=0;['s','f','r'].forEach((k,i)=>$('#n'+[1,2,3][i]).className=p===k?'on':'');p==='f'?renderFiles():renderSummary()}

/* ---------- Parsing ---------- */
async function readRows(file){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',dense:true});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}
const H=(rows,names)=>{const h=rows[0].map(x=>String(x).trim().replace(/\s*\/\s*/g,'/').toLowerCase());return names.map(n=>h.indexOf(n.toLowerCase()))};

function parseBox(rows){
  const[st,em,nm,dv,di]=H(rows,['Status','Emp Code','Madani Atyat Box Zimmadar','Division','District/Metropolitan']);
  if(em<0||st<0)throw Error('Box Place List columns not found');
  const B={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(String(r[st]).trim()!=='Placed')continue;
    const e=String(r[em]).trim();if(!e)continue;
    const o=B[e]||(B[e]={n:0,nm:String(r[nm]).trim(),dv:norm(r[dv]),di:norm(r[di])});o.n++;
  }
  return B;
}

function parseCol(rows){
  const[d,en,em,nm,st,am,dt,dp,dv,di]=H(rows,['Collection Date','Entry Date Time','Emp Code','Madani Atyat Box Zimmadar','Collection Status','Amount','Donation Type','Deposit Status','Division','District/Metropolitan']);
  if(d<0||em<0||st<0)throw Error('Collection columns not found');
  const cnt={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(String(r[st]).trim()==='Normal Collection'){
      const y=ymd(r[d]);
      if(y){const k=y[0]+'-'+y[1];cnt[k]=(cnt[k]||0)+1}
    }
  }
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(!best)throw Error('No Normal Collection rows found');
  const ym=best.split('-').map(Number);
  const E={};let maxDay=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i],s=String(r[st]).trim(),W=s==='Walk in Collection';
    if(!(W||s==='Normal Collection'||s==='Shop Closed'||s==='Box Empty'))continue;
    const y=ymd(W&&en>=0?r[en]:r[d]);
    if(!y||y[0]!==ym[0]||y[1]!==ym[1])continue;
    const e=String(r[em]).trim();if(!e)continue;
    const o=E[e]||(E[e]={nm:String(r[nm]).trim(),dv:norm(r[dv]),di:norm(r[di]),days:{}});
    const a=o.days[y[2]]||(o.days[y[2]]=[0,0,0,0,0,0,0,0,0]);
    const amt=+r[am]||0,dep=String(r[dp]).trim()==='Deposited';
    if(s==='Normal Collection'){a[0]++;a[1]+=amt;if(/wajiba/i.test(r[dt]))a[2]+=amt;if(y[2]>maxDay)maxDay=y[2]}
    else if(W){a[3]++;a[4]+=amt}
    else if(s==='Shop Closed')a[5]++;
    else a[6]++;
    if(s==='Normal Collection'||W){if(dep)a[7]+=amt;else a[8]+=amt}
  }
  return{ym,maxDay,emps:E};
}

/* ---------- Files page ---------- */
function renderFiles(){
  const a=S.user.admin;
  const st=(o,t)=>o?`<span class="dn">Loaded</span> ${t(o)}`:'<span class="mut">Not uploaded</span>';
  const nb=o=>Object.keys(o).length+' emps with placed boxes';
  const nc=o=>pad(o.ym[1])+'-'+o.ym[0]+' \u00b7 '+Object.keys(o.emps).length+' emps \u00b7 data up to day '+o.maxDay;
  $('#pg').innerHTML=`<h2 style="margin-bottom:10px">Upload Files</h2><div class="grid">
${a?`<div class="card"><h3>Box Place List</h3><p>${st(S.box,nb)}</p><input type="file" accept=".xlsx,.xls" onchange="up('box',this.files[0])"></div>
<div class="card"><h3>Previous Month Collection</h3><p>${st(S.prev,nc)}</p><input type="file" accept=".xlsx,.xls" onchange="up('prev',this.files[0])"></div>`:''}
<div class="card"><h3>Current Month Collection</h3><p>${st(S.cur,nc)}</p><input type="file" accept=".xlsx,.xls" onchange="up('cur',this.files[0])"><p class="mut">Daily updated file. It is saved automatically.</p></div></div>
${a&&S.unsaved?`<div class="row" style="margin-top:12px"><button class="gold" onclick="saveFiles()">Save</button><button class="alt" onclick="refreshFiles()">Refresh</button><span class="mut">Save keeps Box Place List and Previous Month for the month. Refresh removes them so you can upload again.</span></div>`:''}
${a&&!S.unsaved&&(S.box||S.prev)?`<div class="row" style="margin-top:12px"><button class="alt" onclick="refreshFiles()">Refresh</button><span class="mut">Remove saved Box Place List and Previous Month data.</span></div>`:''}
<p class="mut" id="msg"></p>`;
}

async function up(k,f){
  if(!f)return;
  $('#msg').textContent='Reading '+f.name+' \u2026 please wait';
  await new Promise(r=>setTimeout(r,40));
  try{
    const rows=await readRows(f);
    const v=k==='box'?parseBox(rows):parseCol(rows);
    S[k]=v;
    if(k==='cur'){showLoad(true);await dbSet('cur',v);showLoad(false);S.f.a=S.f.b=''}
    else S.unsaved=true;
    toast('File read successfully');
  }catch(e){toast('Error: '+e.message)}
  renderFiles();
}

async function saveFiles(){
  showLoad(true);
  try{
    if(S.box)await dbSet('box',S.box);
    if(S.prev)await dbSet('prev',S.prev);
    S.unsaved=false;toast('Saved to Google Sheet');
  }catch(e){toast('Save error: '+e.message)}
  finally{showLoad(false)}
  renderFiles();
}

async function refreshFiles(){
  if(!confirm('Remove Box Place List and Previous Month data?'))return;
  showLoad(true);
  try{
    S.box=S.prev=null;S.unsaved=false;
    await dbSet('box',null);await dbSet('prev',null);
    toast('Data removed, upload files again');
  }catch(e){toast('Error: '+e.message)}
  finally{showLoad(false)}
  renderFiles();
}

/* ---------- Calculations ---------- */
function rng(){const c=S.cur;if(!c)return{a:1,b:31,pb:31};const a=S.f.a?+S.f.a.slice(8):1;if(S.f.b){const b=+S.f.b.slice(8);return{a,b,pb:b}}return{a,b:31,pb:S.f.same?c.maxDay:31}}
function agg(m,emp,a,b){const o={nC:0,nA:0,wj:0,wC:0,wA:0,sc:0,be:0,start:null};const e=m&&m.emps[emp];if(!e)return o;
 for(const k in e.days){const d=+k,r=e.days[k];if(r[0]>0&&(o.start==null||d<o.start))o.start=d;if(d<a||d>b)continue;o.nC+=r[0];o.nA+=r[1];o.wj+=r[2];o.wC+=r[3];o.wA+=r[4];o.sc+=r[5];o.be+=r[6]}return o}
const lastDate=n=>n<500?20:n<800?25:28;
function info(emp){return(S.box&&S.box[emp])||(S.cur&&S.cur.emps[emp])||(S.prev&&S.prev.emps[emp])||{}}

function list(){
  const{a,b,pb}=rng(),f=S.f,q=f.q.trim().toLowerCase(),u=S.user,set=new Set();
  [S.box,S.cur&&S.cur.emps,S.prev&&S.prev.emps].forEach(o=>o&&Object.keys(o).forEach(k=>set.add(k)));
  const out=[];
  for(const e of set){
    const i=info(e),dv=i.dv||'',di=i.di||'';
    if(!u.admin&&dv!==u.div)continue;
    if(f.div&&dv!==f.div)continue;
    if(f.dis&&di!==f.dis)continue;
    if(q&&!(e.toLowerCase().includes(q)||String(i.nm||'').toLowerCase().includes(q)))continue;
    const pl=S.box&&S.box[e]?S.box[e].n:0,P=agg(S.prev,e,a,pb),C=agg(S.cur,e,a,b);
    if(!pl&&!P.nC&&!C.nC)continue;
    out.push({e,i,pl,P,C});
  }
  out.sort((x,y)=>(x.i.dv||'').localeCompare(y.i.dv||'')||(x.i.di||'').localeCompare(y.i.di||'')||x.e.localeCompare(y.e,undefined,{numeric:true}));
  return out;
}

/* ---------- Summary ---------- */
function renderSummary(){
  const c=S.cur;
  if(!c||!S.box){
    $('#pg').innerHTML=`<div class="card"><h3>Files needed</h3><p>${S.user.admin?'Open the Files page and upload Box Place List, Previous Month and Current Month collection.':'Admin has not uploaded the data yet.'} ${!S.user.admin&&!c?'You can upload the Current Month Collection from the Files page.':''}</p></div>`;
    return;
  }
  if(!S.f.a)S.f.a=c.ym[0]+'-'+pad(c.ym[1])+'-01';
  const dv=new Set(),ds=new Set();
  [S.box,c.emps].forEach(o=>Object.values(o).forEach(i=>{if(S.user.admin||i.dv===S.user.div){dv.add(i.dv);if(!S.f.div||i.dv===S.f.div)ds.add(i.di)}}));
  const opt=(s,v)=>'<option value="">All</option>'+[...s].filter(Boolean).sort().map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('');
  $('#pg').innerHTML=(S.page==='r'?repTabs():'')+`<div class="row" style="margin-bottom:10px">
<select onchange="S.f.div=this.value;S.f.dis='';S.pg=0;renderSummary()" ${S.user.admin?'':'disabled'}>${opt(dv,S.f.div)}</select>
<select onchange="S.f.dis=this.value;S.pg=0;renderSummary()">${opt(ds,S.f.dis)}</select>
<label class="mut">From <input type="date" value="${S.f.a}" onchange="S.f.a=this.value;renderTable()"></label>
<label class="mut">To <input type="date" value="${S.f.b}" onchange="S.f.b=this.value;renderTable()"></label>
<label class="mut"><input type="checkbox" ${S.f.same?'checked':''} onchange="S.f.same=this.checked;renderTable()"> Pichla mahina bhi isi date tak</label><input id="q" placeholder="Search Emp Code or Name" value="${S.f.q}" oninput="S.f.q=this.value;S.pg=0;renderTable()" style="min-width:210px"></div>
<div id="tb"></div>`;
  renderTable();
  const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);
}

function renderTable(){
  let L=list();
  if(S.page==='r')L=L.filter(PRED[S.rp]);
  const c=S.cur,P=S.prev?S.prev.ym:null,N=200,pg=Math.min(S.pg,Math.max(0,Math.ceil(L.length/N)-1)),rows=L.slice(pg*N,pg*N+N);
  const sd=(d,m)=>d==null?'\u2014':pad(d)+'-'+pad(m[1]),bl=v=>v==null?'\u2014':`<b class="${v>0?'dn':v<0?'up':'mut'}">${v>0?'+':''}${fmt(v)}</b>`;
  $('#tb').innerHTML=kpi(L)+`<div class="mut" style="margin-bottom:6px">${L.length} Box Zimedar \u00b7 data up to ${dlabel(c.maxDay,c.ym)}</div>
<div class="tw" style="max-height:70vh"><table><thead><tr><th>Division</th><th>District</th><th>Emp Code</th><th>Madani Atiyat Box Zimedar</th><th>Start Prev</th><th>Start Cur</th><th class="fq">Farq</th><th>Placed</th><th>Open Prev</th><th>Open Cur</th><th class="fq">Farq</th><th>Normal Atiyat Prev</th><th>Normal Atiyat Cur</th><th class="fq">Farq</th><th>Total Atiyat Prev</th><th>Total Atiyat Cur</th><th class="fq">Farq</th></tr></thead><tbody>
${rows.map(x=>{const fq=x.P.start!=null&&x.C.start!=null?x.P.start-x.C.start:null;return`<tr class="c" onclick="openEmp('${x.e}')"><td>${x.i.dv||''}</td><td>${x.i.di||''}</td><td>${x.e}</td><td>${x.i.nm||''}</td><td>${sd(x.P.start,P||c.ym)}</td><td>${sd(x.C.start,c.ym)}</td><td class="fq">${bl(fq)}</td><td>${fmt(x.pl)}</td><td>${fmt(x.P.nC)}</td><td>${fmt(x.C.nC)}</td><td class="fq">${bl(x.C.nC-x.P.nC)}</td><td>${fmt(x.P.nA)}</td><td>${fmt(x.C.nA)}</td><td class="fq">${bl(x.C.nA-x.P.nA)}</td><td>${fmt(x.P.nA+x.P.wA)}</td><td>${fmt(x.C.nA+x.C.wA)}</td><td class="fq">${bl((x.C.nA+x.C.wA)-(x.P.nA+x.P.wA))}</td></tr>`}).join('')}</tbody></table></div>
<div class="row" style="margin-top:8px"><button class="alt" ${pg?'':'disabled'} onclick="S.pg=${pg-1};renderTable()">Prev</button><span class="mut">Page ${pg+1} of ${Math.max(1,Math.ceil(L.length/N))}</span><button class="alt" ${(pg+1)*N<L.length?'':'disabled'} onclick="S.pg=${pg+1};renderTable()">Next</button></div>`;
}

const REP=['Kaam shuru nahi kia','Date negative','Open Box negative','Atiyat negative'],RD=['Pichle mahine kaam kia tha lekin is mahine abhi tak kaam shuru nahi kia','Jin ki start date pichle mahine se late hai','Jin ke open boxes pichle mahine se kam hain','Jin ki atiyat pichle mahine se kam hai'];
const PRED=[x=>x.P.nC>0&&x.C.nC===0,x=>x.P.start!=null&&x.C.start!=null&&x.P.start-x.C.start<0,x=>x.C.nC<x.P.nC,x=>x.C.nA+x.C.wA<x.P.nA+x.P.wA];
function repTabs(){return`<h2 style="margin-bottom:8px">Report ${S.rp+1}: ${REP[S.rp]}</h2><div class="tabs">${REP.map((t,i)=>`<button class="${i===S.rp?'on':'alt'}" onclick="S.rp=${i};S.pg=0;renderSummary()">Report ${i+1}</button>`).join('')}</div><p class="mut">${RD[S.rp]}</p>`}

function kpi(L){const s=L.reduce((o,x)=>{o.p+=x.P.nC;o.c+=x.C.nC;o.tp+=x.P.nA+x.P.wA;o.tc+=x.C.nA+x.C.wA;o.pl+=x.pl;return o},{p:0,c:0,tp:0,tc:0,pl:0});return`<div class="kp"><div><small>Box Zimedar</small><b>${fmt(L.length)}</b></div><div><small>Placed Boxes</small><b>${fmt(s.pl)}</b></div><div><small>Open Box (Cur / Prev)</small><b>${fmt(s.c)}</b> <span class="mut">/ ${fmt(s.p)}</span> ${fq(s.c-s.p,0)}</div><div><small>Total Atiyat (Cur / Prev)</small><b>${fmt(s.tc)}</b> <span class="mut">/ ${fmt(s.tp)}</span> ${fq(s.tc-s.tp,0)}</div></div>`}

/* ---------- Employee window ---------- */
function openEmp(e){S.emp=e;S.tab='t';drawEmp();$('#modal').hidden=false}
function fq(v,col){if(v==null)return'\u2014';const c=col?(v<0?'dn':v>0?'up':''):(v>0?'dn':v<0?'up':'');return`<span class="${c}">${v>0?'+':''}${fmt(v)}</span>`}

function drawEmp(){
  const e=S.emp,i=info(e),{a,b,pb}=rng(),P=agg(S.prev,e,a,pb),C=agg(S.cur,e,a,b),c=S.cur,pl=S.box&&S.box[e]?S.box[e].n:0;
  const tabs=`<div class="row" style="margin:8px 0"><button class="${S.tab==='t'?'':'alt'}" onclick="S.tab='t';drawEmp()">Taqabul</button><button class="${S.tab==='j'?'':'alt'}" onclick="S.tab='j';drawEmp()">Jadwal</button><button class="gold" onclick="shot()">JPEG</button><button class="wa" onclick="shot(1)">WhatsApp</button><button class="alt" onclick="$('#modal').hidden=true">Close</button></div>`;
  const head=`<div id="cap"><div class="ban"><h2>Dawat e Islami \u00b7 Donation Box Department</h2><small>Follow-up Report \u00b7 data up to ${dlabel(c.maxDay,c.ym)}</small></div><div class="kv"><span>Emp Code: <b>${e}</b></span><span>Name: <b>${i.nm||''}</b></span><span>Division: <b>${i.dv||''}</b></span><span>District: <b>${i.di||''}</b></span><span>Placed Boxes: <b>${fmt(pl)}</b></span></div>`;
  let body='';
  if(S.tab==='t'){
    const T=x=>x.nA+x.wA,pm=S.prev?S.prev.ym:c.ym;
    const R=[['Working Start Date',dlabel(P.start,pm),dlabel(C.start,c.ym),P.start!=null&&C.start!=null?P.start-C.start:null,0],
    ['Boxes Open (Normal Collection)',P.nC,C.nC,C.nC-P.nC,0],['Walking Collection',P.wC,C.wC,C.wC-P.wC,0],['Shop Closed',P.sc,C.sc,C.sc-P.sc,1],['Box Empty',P.be,C.be,C.be-P.be,1],
    ['Normal Collection Atiyat',P.nA,C.nA,C.nA-P.nA,0],['Walkin Atiyat',P.wA,C.wA,C.wA-P.wA,0],['Nafila',P.nA-P.wj,C.nA-C.wj,(C.nA-C.wj)-(P.nA-P.wj),0],['Wajiba',P.wj,C.wj,C.wj-P.wj,0],['Total Atiyat',T(P),T(C),T(C)-T(P),0]];
    const late=C.start!=null?C.start-1:null,last=lastDate(pl),left=Math.max(0,last-c.maxDay),rb=Math.max(0,pl-C.nC),ra=Math.max(0,T(P)-T(C));
    body=`<div class="kp"><div><small>Open Boxes</small><b>${fmt(C.nC)}</b> ${fq(C.nC-P.nC,0)}</div><div><small>Total Atiyat</small><b>${fmt(T(C))}</b> ${fq(T(C)-T(P),0)}</div><div><small>Working Start</small><b>${C.start==null?'\u2014':pad(C.start)+'-'+pad(c.ym[1])}</b> ${fq(P.start!=null&&C.start!=null?P.start-C.start:null,0)}</div></div><div class="tw"><table><thead><tr><th>Particulars</th><th>Last Month</th><th>Current Month</th><th>Farq</th></tr></thead><tbody>${R.map(r=>`<tr><td style="text-align:left">${r[0]}</td><td>${typeof r[1]==='string'?r[1]:fmt(r[1])}</td><td>${typeof r[2]==='string'?r[2]:fmt(r[2])}</td><td>${fq(r[3],r[4])}</td></tr>`).join('')}</tbody></table></div>
<h3 style="margin-top:12px">Mazeed Detail</h3><ul class="ex"><li>Kaam shuru karne mai late: <b>${late==null?'\u2014':late+' din'}</b> (1st se)${P.start!=null&&C.start!=null?' \u00b7 pichle mahine se farq <b>'+(P.start-C.start)+'</b> din':''}</li>
<li>Last date <b>${last}</b>, current date <b>${c.maxDay}</b>: kaam ke liye <b>${left}</b> din baqi</li>
<li>Mazeed Boxes per Rasai kerna baqi: <b>${fmt(rb)}</b>${left&&rb?' (roz taqreeban '+Math.ceil(rb/left)+' boxes)':''}</li>
<li>Mazeed atiyat jama karna baqi (pichle mahine ke muqabil): <b>${fmt(ra)}</b>${left&&ra?' (roz taqreeban '+fmt(Math.ceil(ra/left))+')':''}</li></ul>`;
  } else {
    const ds=Object.keys((c.emps[e]||{days:{}}).days).map(Number).sort((x,y)=>x-y);
    let t=[0,0,0];
    const rs=ds.map(d=>{const r=c.emps[e].days[d],tot=r[1]+r[4];t[0]+=tot;t[1]+=r[7];t[2]+=r[8];return`<tr><td style="text-align:left">${dlabel(d,c.ym)}</td><td>${fmt(tot)}</td><td>${fmt(r[7])}</td><td>${fmt(r[8])}</td></tr>`}).join('');
    body=`<div class="tw"><table><thead><tr><th>Dates</th><th>Total Collection</th><th>Deposit Amount</th><th>Undeposit Amount</th></tr></thead><tbody>${rs||'<tr><td colspan="4">No data</td></tr>'}<tr style="font-weight:700"><td style="text-align:left">Total</td><td>${fmt(t[0])}</td><td>${fmt(t[1])}</td><td>${fmt(t[2])}</td></tr></tbody></table></div>`;
  }
  $('#mbox').innerHTML=tabs+head+body+'</div>';
}

async function shot(wa){
  toast('Preparing JPEG \u2026');
  try{
    const cv=await html2canvas($('#cap'),{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2});
    const u=cv.toDataURL('image/jpeg',.92);
    if(wa){
      try{
        const bb=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92)),fl=new File([bb],'Emp-'+S.emp+'.jpg',{type:'image/jpeg'});
        if(navigator.canShare&&navigator.canShare({files:[fl]})){
          await navigator.share({files:[fl],text:'Follow-up Report Emp '+S.emp});
          $('#toast').hidden=true;return;
        }
      }catch(e){if(e&&e.name==='AbortError'){$('#toast').hidden=true;return}}
    }
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;overflow:auto;padding:14px;text-align:center';
    o.innerHTML=`<p style="color:#fff">Press and hold (or right-click) the image to save it, then send it on WhatsApp</p><p><a href="https://wa.me/?text=Follow-up%20Report" target="_blank" style="color:#25D366;font-weight:700">Open WhatsApp</a></p><img src="${u}" style="max-width:100%;border-radius:6px"><p><button onclick="this.closest('div').remove()">Close</button></p>`;
    document.body.appendChild(o);$('#toast').hidden=true;
  }catch(e){toast('JPEG failed: '+e.message)}
}

showLogin();
</script></body></html>
